name: Build Lite APK
# Both apps live in their own folder of this repository. GitHub only reads workflows
# from the root .github/workflows, so this file sits here and points every run step
# into the app folder with working-directory. The path: inputs on actions/cache and
# actions/upload-artifact are NOT affected by working-directory - they are always read
# from the repository root - so those two carry the folder name explicitly.
# The tracking-only driver app: same dashboard, same database, no camera, no on-device
# model, no events, no alerts, no tones. Built as its own applicationId
# (com.example.fleetlite) so a phone can carry it beside the full Fleet Tracker.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # A change to the full app must not spend a lite build.
    paths:
      - 'fleet-tracker-lite/**'
      - '.github/workflows/build-apk-lite.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-tracker-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The same key as the full app. It is the key, not the package name, that decides
      # whether an update replaces the installed app, and a fresh key here would mean
      # every lite driver reinstalling from scratch.
      - name: Load signing key from secret
        id: key
        env:
          FLEET_KEYSTORE_B64: ${{ secrets.FLEET_KEYSTORE_B64 }}
        run: |
          trap 'echo "::error::The signing key could not be read from the FLEET_KEYSTORE_B64 secret (failing line $LINENO). Save the secret as one base64 string with no headers, no spaces and no carriage returns." | head -c 600; exit 1' ERR
          if [ -n "$FLEET_KEYSTORE_B64" ]; then
            printf '%s' "$FLEET_KEYSTORE_B64" \
              | tr -d '\r\n \t' \
              | sed -E 's/-----[A-Za-z ]+-----//g' \
              | base64 -di > fleet.keystore
            SZ=$(stat -c %s fleet.keystore)
            [ "$SZ" -gt 500 ] || { echo "::error::FLEET_KEYSTORE_B64 decoded to only $SZ bytes - the secret is truncated or is not this keystore."; exit 1; }
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Fall back to the cached key
        if: steps.key.outputs.source != 'secret'
        uses: actions/cache@v4
        with:
          path: fleet-tracker-lite/fleet.keystore
          key: fleet-keystore-lite-v1
      - name: Check the signing key
        env:
          KS_PASS: ${{ secrets.FLEET_KEYSTORE_PASSWORD }}
          SRC: ${{ steps.key.outputs.source }}
        run: |
          if [ ! -s fleet.keystore ]; then
            echo "::error::No signing key available: the FLEET_KEYSTORE_B64 secret is empty and the fleet-keystore-lite-v1 cache entry is gone."
            echo "Generating a fresh key here would change the APK signature, so every driver has to uninstall and reinstall."
            exit 1
          fi
          if [ -z "$KS_PASS" ]; then
            echo "::error::Missing the FLEET_KEYSTORE_PASSWORD secret."
            exit 1
          fi
          if ! keytool -list -keystore fleet.keystore -storepass "$KS_PASS" -alias fleet >/dev/null 2>&1; then
            echo "::error::fleet.keystore (from the $SRC) cannot be opened with FLEET_KEYSTORE_PASSWORD, or has no 'fleet' alias."
            echo "::error::The key and the password come from different keystores. Correct the secret - do not generate a new key, that changes the APK signature and forces every driver to reinstall."
            exit 1
          fi
          echo "Signing key verified (source: $SRC)."
      # Deliberately not the full app's list: no @capacitor-community/text-to-speech.
      # The page has no voice, no tones and no camera, and cap sync registers a plugin
      # into the app from package.json alone, so leaving it in would ship a speech
      # engine that nothing can call.
      - name: Install the build packages
        run: |
          trap 'echo "::error::npm could not install the Capacitor packages (failing line $LINENO)"; exit 1' ERR
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/device@7 @capacitor/local-notifications@7 @capacitor/browser@7 @capacitor-community/background-geolocation@1.2.26 file:./plugins/fleet-dms esbuild
      - name: Bundle the plugin bridge
        run: |
          trap 'echo "::error::www/bridge.js could not be built (failing line $LINENO)"; exit 1' ERR
          echo "import { registerPlugin } from '@capacitor/core';" > bridge.js
          echo "window.CapPlugins = { BG: registerPlugin('BackgroundGeolocation'), Device: registerPlugin('Device'), LN: registerPlugin('LocalNotifications'), Browser: registerPlugin('Browser'), Dms: registerPlugin('FleetDms') };" >> bridge.js
          npx esbuild bridge.js --bundle --minify --outfile=www/bridge.js
          # The one name that would prove a camera call is still reachable from the page.
          if grep -qE "Camera|TextToSpeech|MediaPipe" www/bridge.js; then
            echo "::error::www/bridge.js still registers a camera or voice plugin."; exit 1
          fi
      - name: Copy the map libraries into the app
        run: |
          # Same as the full app: the driver has to be able to open the map and sign in
          # in a dead spot, so the map library, the database client and the icon font
          # travel inside the APK instead of being fetched from a CDN at start-up.
          trap 'echo "::error::the offline copies of the map libraries were not built (failing line $LINENO)"; exit 1' ERR
          npm i --no-save leaflet@1.9.4 @supabase/supabase-js@2.45.4 @fortawesome/fontawesome-free@6.5.1
          mkdir -p www/vendor/fa/css www/vendor/fa/webfonts
          cp node_modules/leaflet/dist/leaflet.js www/vendor/leaflet.js
          cp node_modules/leaflet/dist/leaflet.css www/vendor/leaflet.css
          # Read off the built file, not from the layout of the npm package: the
          # realtime client (postgres_changes, Presence, phx_leave) is inside
          # supabase.js itself, and 591.supabase.js is the Node-only WebSocket shim
          # that the bundle reaches for only when the page has no native WebSocket -
          # which a WebView always has. So this second file is copied for folder
          # parity with the CDN umd directory the page falls back to, not because a
          # phone without signal needs it. Losing it would not cost blackbox answers:
          # bbWatch also polls every 60s and the page answers again on 'online'.
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js
          cp node_modules/@supabase/supabase-js/dist/umd/591.supabase.js www/vendor/591.supabase.js
          cp node_modules/@fortawesome/fontawesome-free/css/all.min.css www/vendor/fa/css/all.min.css
          cp node_modules/@fortawesome/fontawesome-free/webfonts/fa-*-*.woff2 www/vendor/fa/webfonts/
          for f in www/vendor/leaflet.js www/vendor/leaflet.css www/vendor/supabase.js www/vendor/591.supabase.js www/vendor/fa/css/all.min.css; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty after the copy."; exit 1; }
          done
          [ "$(ls www/vendor/fa/webfonts/*.woff2 2>/dev/null | wc -l)" -ge 3 ] || { echo "::error::no icon fonts in www/vendor/fa/webfonts - the buttons would render as empty boxes."; exit 1; }
          ls -l www/vendor www/vendor/fa/css www/vendor/fa/webfonts
      # There is no model download and no minSdk raise in this build, and that is the
      # point of it: the two files together are most of the weight of the full APK, and
      # both only exist because of the driver camera.
      - name: Create the Android project
        run: |
          trap 'echo "::error::the Android project could not be created (failing line $LINENO)"; exit 1' ERR
          npx cap add android
          # Location, and only location. The full app's line also asks for VIBRATE, which
          # is for alert buzzers this build does not have. ACCESS_BACKGROUND_LOCATION is
          # what a locked phone needs to go on reporting, and FOREGROUND_SERVICE_LOCATION
          # is what API 34 demands for the runner service; both halves of that service are
          # in the lite plugin's own manifest, which the merger brings in.
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/; s/<application/<application android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml
          # Nothing may be left to the mercy of the template: if the SDK floor moved out
          # from under this build, say so here rather than ship an APK that installs on a
          # handset the plugin cannot run on.
          grep -Eq 'minSdkVersion = 2[0-9]' android/variables.gradle || { echo "::error::android/variables.gradle no longer holds an minSdkVersion this build understands."; exit 1; }
          npx cap sync android
          PL=android/app/src/main/assets/capacitor.plugins.json
          [ -s "$PL" ] || { echo "::error::$PL was not written by cap sync."; exit 1; }
          # The runner is what reports a trip while the screen is locked, and the blackbox
          # store lives behind the same class. Missing from this list, the phone still
          # builds, installs and drives - it just stops filling the office's map.
          grep -q 'com.fleet.dms.FleetDmsPlugin' "$PL" || { echo "::error::cap sync did not register the background runner. It reads plugins/fleet-dms/package.json for the module path and the Java under plugins/fleet-dms/android/src/main for the class name, so check the capacitor manifest and the @CapacitorPlugin annotation."; exit 1; }
          grep -qiE 'TextToSpeech|Camera' "$PL" && { echo "::error::cap sync registered a voice or camera plugin in the lite build."; exit 1; }
          cat "$PL"
      - name: Generate app icons
        continue-on-error: true
        run: |
          npm i --no-save sharp@0.33.5
          node tools/make-icons.js --direct
          ls -l android/app/src/main/res/mipmap-xxxhdpi/
      - name: Build the release APK with Gradle
        run: |
          chmod +x android/gradlew
          set +o pipefail
          (cd android && ./gradlew assembleRelease --console=plain --warning-mode=none 2>&1) | tee gradle.log
          RC=${PIPESTATUS[0]}
          set -o pipefail
          if [ "$RC" -ne 0 ]; then
            echo "::group::why the build failed"
            grep -nE "FAILURE:|^\* What went wrong|^\* Where|^> Task .* FAILED|error:|Execution failed for task|Could not (find|resolve|determine|create)" gradle.log | tail -40
            echo "--- last 60 lines ---"
            tail -60 gradle.log
            echo "::endgroup::"
            KEY=$(grep -A6 "^\* What went wrong:" gradle.log | head -30)
            [ -n "$KEY" ] || KEY=$(grep -E "FAILURE:|error:|^> Task .* FAILED|Could not (find|resolve|determine|create)" gradle.log | head -12)
            [ -n "$KEY" ] || KEY=$(tail -6 gradle.log)
            MSG=$(printf '%s\n' "$KEY" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/[[:space:]]\{1,\}/ /g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error::Gradle could not build the lite release APK (exit $RC): ${MSG:0:1500}"
            exit 1
          fi
          grep -q "BUILD SUCCESSFUL" gradle.log || { echo "::error::Gradle said it succeeded but left no BUILD SUCCESSFUL line."; exit 1; }
          ls -l android/app/build/outputs/apk/release/
      - name: Align and sign the APK
        env:
          KS_PASS: ${{ secrets.FLEET_KEYSTORE_PASSWORD }}
        run: |
          trap 'echo "::error::the APK could not be aligned or signed (failing line $LINENO)"; exit 1' ERR
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          [ -x "$BT/zipalign" ] || { echo "::error::No build-tools with zipalign under $ANDROID_HOME"; exit 1; }
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          [ -s "$UNSIGNED" ] || { echo "::error::Gradle produced no $UNSIGNED."; exit 1; }
          $BT/zipalign -p 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks fleet.keystore --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias fleet --out fleet-tracker-lite.apk aligned.apk
      # The claim this build sells is "no camera, no listening, no alerts", and a claim
      # nobody checks is a claim that quietly stops being true the day someone merges a
      # file back in. Three reads of the built APK, all of them cheap.
      - name: Check the signed APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs fleet-tracker-lite.apk || { echo "::error::fleet-tracker-lite.apk is not a valid signed APK."; exit 1; }
          PERMS=$($BT/aapt dump permissions fleet-tracker-lite.apk)
          echo "$PERMS"
          echo "$PERMS" | grep -q 'package: com.example.fleetlite' || { echo "::error::the APK is not com.example.fleetlite - it would replace the full driver app on a phone."; exit 1; }
          # The runner is the whole of this app: with the page closed it is the only thing
          # still reporting, and a reboot at a depot takes it down. The permission, the
          # receiver class and its BOOT_COMPLETED filter all have to survive the manifest
          # merger, so they are read off the built APK rather than trusted from the source.
          # exported must be true or a system broadcast cannot reach it on API 31 and later.
          echo "$PERMS" | grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' || { echo "::error::the APK cannot hear a reboot: RECEIVE_BOOT_COMPLETED is not in the merged manifest. It is declared in plugins/fleet-dms/android/src/main/AndroidManifest.xml, so check that the plugin module is still part of the build."; exit 1; }
          $BT/aapt dump xmltree fleet-tracker-lite.apk AndroidManifest.xml > manifest.txt
          grep -q '"com.fleet.dms.BootReceiver"' manifest.txt || { echo "::error::com.fleet.dms.BootReceiver is not in the shipped manifest - the plugin manifest was not merged, so nothing brings the runner back after a reboot."; exit 1; }
          BLOCK=$(grep -A6 '"com.fleet.dms.BootReceiver"' manifest.txt)
          echo "$BLOCK" | grep -q 'android.intent.action.BOOT_COMPLETED' || { echo "::error::the boot receiver is declared without a BOOT_COMPLETED filter, so Android will never call it."; exit 1; }
          echo "$BLOCK" | grep -q 'android:exported(0x01010010)=(type 0x12)0xffffffff' || { echo "::error::the boot receiver is not exported=true, so the system broadcast cannot reach it on API 31 and later."; exit 1; }
          if echo "$PERMS" | grep -qE 'uses-permission: name=.android.permission.CAMERA'; then
            echo "::error::the lite APK asks for the camera. This build has no camera at all, so a permission line has come back with it."; exit 1
          fi
          # RECORD_AUDIO and the two model files are the other things that only the driver
          # camera ever needed; a media capability in the manifest is the same regression.
          if echo "$PERMS" | grep -qE 'android.permission.(CAMERA|RECORD_AUDIO)'; then
            echo "::error::the lite APK still declares a camera or microphone permission."; exit 1
          fi
          if unzip -l fleet-tracker-lite.apk | grep -qE 'face_landmarker|efficientdet|/mediapipe|\.wav$'; then
            echo "::error::the lite APK carries a driver-camera model or a tone file."; unzip -l fleet-tracker-lite.apk | head -40; exit 1
          fi
          if unzip -l fleet-tracker-lite.apk | grep -qE 'lib.*mediapipe|libtensorflow'; then
            echo "::error::the lite APK carries on-device vision native code."; exit 1
          fi
          ls -l fleet-tracker-lite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-tracker-lite-apk
          path: fleet-tracker-lite/fleet-tracker-lite.apk
      # Its own release tag: 'latest' is the full app's, and drivers install from it.
      - name: Publish APK as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-lite --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest-lite fleet-tracker-lite.apk --title "Fleet Tracker Lite APK" --notes "Latest tracking-only build" --repo ${{ github.repository }} \
            || echo "::warning::The lite APK built fine and is in the Artifacts list, but the 'latest-lite' release was not updated."
