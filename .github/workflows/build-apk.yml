name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/device@7 @capacitor/local-notifications@7 @capacitor/browser@7 @capacitor-community/background-geolocation@1.2.26 esbuild
          echo "import { registerPlugin } from '@capacitor/core';" > bridge.js
          echo "window.CapPlugins = { BG: registerPlugin('BackgroundGeolocation'), Device: registerPlugin('Device'), LN: registerPlugin('LocalNotifications'), Browser: registerPlugin('Browser') };" >> bridge.js
          npx esbuild bridge.js --bundle --minify --outfile=www/bridge.js
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/; s/<application/<application android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: fleet.keystore
          key: fleet-keystore-v1
      - name: Create signing key (first time only)
        if: steps.ks.outputs.cache-hit != 'true'
        run: keytool -genkeypair -keystore fleet.keystore -alias fleet -keyalg RSA -keysize 2048 -validity 10000 -storepass fleetpass123 -keypass fleetpass123 -dname "CN=Fleet Tracker, O=Ameer Naji"
      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks fleet.keystore --ks-pass pass:fleetpass123 --key-pass pass:fleetpass123 --out fleet-tracker.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-tracker-apk
          path: fleet-tracker.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest fleet-tracker.apk --title "Fleet Tracker APK" --notes "Latest build" --repo ${{ github.repository }}
