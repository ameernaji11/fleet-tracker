name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Load signing key from secret
        id: key
        env:
          FLEET_KEYSTORE_B64: ${{ secrets.FLEET_KEYSTORE_B64 }}
        run: |
          if [ -n "$FLEET_KEYSTORE_B64" ]; then
            printf '%s' "$FLEET_KEYSTORE_B64" | base64 -d > fleet.keystore
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Fall back to the cached key
        if: steps.key.outputs.source != 'secret'
        uses: actions/cache@v4
        with:
          path: fleet.keystore
          key: fleet-keystore-v1
      # Checked before the two-minute Gradle build so a key/password mismatch
      # names itself instead of surfacing as "exit code 2" from apksigner.
      - name: Check the signing key
        env:
          KS_PASS: ${{ secrets.FLEET_KEYSTORE_PASSWORD }}
          SRC: ${{ steps.key.outputs.source }}
        run: |
          if [ ! -s fleet.keystore ]; then
            echo "::error::No signing key available: the FLEET_KEYSTORE_B64 secret is empty and the fleet-keystore-v1 cache entry is gone."
            echo "Generating a fresh key here would change the APK signature, so every driver has to uninstall and reinstall."
            exit 1
          fi
          if [ -z "$KS_PASS" ]; then
            echo "::error::Missing the FLEET_KEYSTORE_PASSWORD secret."
            exit 1
          fi
          if ! keytool -list -keystore fleet.keystore -storepass "$KS_PASS" -alias fleet >/dev/null 2>&1; then
            echo "::error::fleet.keystore (from the $SRC) cannot be opened with FLEET_KEYSTORE_PASSWORD, or has no 'fleet' alias."
            echo "::error::The key and the password come from different keystores. Correct the secret - do not generate a new key, that changes the APK signature and forces every driver to reinstall."
            exit 1
          fi
          echo "Signing key verified (source: $SRC)."
      # This one long step used to be a single "Create Android project" box, so any
      # command inside it that failed printed nothing but "Process completed with
      # exit code 1" and the run could not be read. It is now four named steps, each
      # of which says what it was doing when it broke.
      - name: Install the build packages
        run: |
          trap 'echo "::error::npm could not install the Capacitor packages (failing line $LINENO)"; exit 1' ERR
          npm init -y
          # fleet-dms is our own module, in this repository rather than on npm: the
          # file: path is how Capacitor's CLI finds it, its package.json is what tells
          # the CLI it is a plugin, and plugins/fleet-dms/android is what gets added to
          # the Gradle build as :fleet-dms.
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/device@7 @capacitor/local-notifications@7 @capacitor/browser@7 @capacitor-community/background-geolocation@1.2.26 @capacitor-community/text-to-speech@6.1.0 file:./plugins/fleet-dms esbuild
      - name: Bundle the plugin bridge
        run: |
          trap 'echo "::error::www/bridge.js could not be built (failing line $LINENO)"; exit 1' ERR
          echo "import { registerPlugin } from '@capacitor/core';" > bridge.js
          echo "window.CapPlugins = { BG: registerPlugin('BackgroundGeolocation'), Device: registerPlugin('Device'), LN: registerPlugin('LocalNotifications'), Browser: registerPlugin('Browser'), TTS: registerPlugin('TextToSpeech'), Dms: registerPlugin('FleetDms') };" >> bridge.js
          npx esbuild bridge.js --bundle --minify --outfile=www/bridge.js
      - name: Copy the map libraries into the app
        run: |
          # The app has to open in a basement, a tunnel or a dead spot, so the map
          # library, the database client and the icon font travel inside the APK
          # instead of being fetched from a CDN at start-up. index.html falls back to
          # the CDN only if these files are missing.
          trap 'echo "::error::the offline copies of the map libraries were not built (failing line $LINENO)"; exit 1' ERR
          npm i --no-save leaflet@1.9.4 @supabase/supabase-js@2.45.4 @fortawesome/fontawesome-free@6.5.1
          mkdir -p www/vendor/fa/css www/vendor/fa/webfonts
          cp node_modules/leaflet/dist/leaflet.js www/vendor/leaflet.js
          cp node_modules/leaflet/dist/leaflet.css www/vendor/leaflet.css
          # There is no supabase.min.js inside the npm package - that name only
          # exists on the CDN, which minifies on request - and the library keeps its
          # realtime client in a separate webpack chunk that it loads from its own
          # folder. Copying only supabase.js builds fine and then loses live tracking
          # and the blackbox answers inside the APK, so both files are required.
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js
          cp node_modules/@supabase/supabase-js/dist/umd/591.supabase.js www/vendor/591.supabase.js
          cp node_modules/@fortawesome/fontawesome-free/css/all.min.css www/vendor/fa/css/all.min.css
          cp node_modules/@fortawesome/fontawesome-free/webfonts/fa-*-*.woff2 www/vendor/fa/webfonts/
          for f in www/vendor/leaflet.js www/vendor/leaflet.css www/vendor/supabase.js www/vendor/591.supabase.js www/vendor/fa/css/all.min.css; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty after the copy."; exit 1; }
          done
          [ "$(ls www/vendor/fa/webfonts/*.woff2 2>/dev/null | wc -l)" -ge 3 ] || { echo "::error::no icon fonts in www/vendor/fa/webfonts - the buttons would render as empty boxes."; exit 1; }
          ls -l www/vendor www/vendor/fa/css www/vendor/fa/webfonts
      # The driver's face is read on the handset, so the model that reads it travels
      # inside the APK: a driver in a dead spot cannot download one, and nothing about
      # his eyes ever leaves the phone. It is fetched at build time rather than kept in
      # git because it is a few megabytes of binary nobody can review, and the URL below
      # is a version-pinned copy of it (float16/1).
      - name: Fetch the driver-camera model
        run: |
          trap 'echo "::error::the face model for the driver camera was not fetched (failing line $LINENO)"; exit 1' ERR
          A=plugins/fleet-dms/android/src/main/assets
          mkdir -p "$A"
          curl -fsSL --retry 3 -o "$A/face_landmarker.task" \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          # A half-downloaded file builds into an APK that quietly has no eyes for the
          # whole trip, which is a long way to find out about a bad mirror.
          SZ=$(stat -c %s "$A/face_landmarker.task")
          [ "$SZ" -gt 3000000 ] || { echo "::error::face_landmarker.task is only $SZ bytes - the download did not finish."; exit 1; }
          echo "Driver-camera model ready: $SZ bytes."
      - name: Create the Android project
        run: |
          trap 'echo "::error::the Android project could not be created (failing line $LINENO)"; exit 1' ERR
          npx cap add android
          # The driver-camera library is built for Android 7 and up, and a library may
          # not ask less of the app it is merged into, so the app's own floor moves with
          # it. The grep afterwards is the check that the template still says what it
          # said when this line was written - if it ever changes, the build should stop
          # here rather than fail three minutes later in the Gradle merge.
          sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 24/' android/variables.gradle
          grep -q 'minSdkVersion = 24' android/variables.gradle || { echo "::error::android/variables.gradle no longer holds a minSdkVersion this step can raise to 24."; exit 1; }
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/; s/<application/<application android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml
          # The buzzer tones double as notification-channel sounds, which is how an
          # alert is still heard when Android has frozen this app's JavaScript. A
          # channel points at res/raw by file name, and Android silently plays
          # nothing if that file is missing, so this step has to succeed.
          mkdir -p android/app/src/main/res/raw
          cp www/tones/*.wav android/app/src/main/res/raw/
          ls -l android/app/src/main/res/raw/ | grep -c '\.wav'
          npx cap sync android
          # cap sync is what writes the list of plugin classes the app loads when it
          # starts. If our own module is missing from it the phone still builds, still
          # installs and still drives - only the camera never opens, which is a hard
          # thing to notice from a dashboard. So the build checks it instead.
          PL=android/app/src/main/assets/capacitor.plugins.json
          [ -s "$PL" ] || { echo "::error::$PL was not written by cap sync."; exit 1; }
          grep -q 'com.fleet.dms.FleetDmsPlugin' "$PL" || { echo "::error::cap sync did not register the driver camera. It reads plugins/fleet-dms/package.json for the module path and the Java under plugins/fleet-dms/android/src/main for the class name, so check the capacitor manifest and the @CapacitorPlugin annotation."; exit 1; }
          cat "$PL"
      # One artwork for the browser tab and the phone: both come from www/icon.svg.
      # @capacitor/assets is not used here - its v3 CLI has no icon-only flag and it
      # insists on a splash.png we don't ship, so the mipmaps are written straight
      # into res/ by tools/make-icons.js. The step stays non-fatal: a broken icon
      # must never block an APK the drivers are waiting for.
      - name: Generate app icons
        continue-on-error: true
        run: |
          npm i --no-save sharp@0.33.5
          node tools/make-icons.js --direct
          ls -l android/app/src/main/res/mipmap-xxxhdpi/
      - name: Build signed release APK
        env:
          KS_PASS: ${{ secrets.FLEET_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          [ -x "$BT/zipalign" ] || { echo "::error::No build-tools with zipalign under $ANDROID_HOME"; exit 1; }
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks fleet.keystore --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias fleet --out fleet-tracker.apk aligned.apk
          $BT/apksigner verify fleet-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-tracker-apk
          path: fleet-tracker.apk
      # The APK is already an artifact at this point, so a hiccup here (a stale
      # "latest" tag, a dropped asset upload) must not turn a good build red and
      # make it look as if the phones got nothing.
      - name: Publish APK as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest fleet-tracker.apk --title "Fleet Tracker APK" --notes "Latest build" --repo ${{ github.repository }} \
            || echo "::warning::The APK built fine and is in the Artifacts list, but the 'latest' release was not updated."
