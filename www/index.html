<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui;margin:0;padding:24px;background:#222b31;color:#eef}input,button{font:inherit;padding:12px;width:100%;margin:6px 0;border-radius:6px;border:0}
button{background:#f0b429;font-weight:600}button.stop{background:#b3402f;color:#fff}.card{background:#2f3a41;padding:14px;border-radius:8px;margin:12px 0}.hide{display:none}#err{color:#ffb4a8;font-weight:600}#dbg{font-size:12px;opacity:.75;word-break:break-all}</style></head><body>
<p id="dbg"></p>
<div id="lg"><h2>Driver sign in</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button onclick="signIn()">Sign in</button></div>
<div id="app" class="hide"><h2 id="who"></h2><div class="card" id="st">Stopped</div>
<button id="go" onclick="start()">Start trip</button><button class="stop hide" id="stp" onclick="stop()">End trip</button><button onclick="sb.auth.signOut().then(()=>location.reload())" style="background:#444;color:#fff">Sign out</button></div>
<p id="err"></p>
<script>
const $=i=>document.getElementById(i);
window.onerror=(m,s,l)=>{$('err').textContent='Error: '+m+' (line '+l+')'};
window.addEventListener('unhandledrejection',e=>{$('err').textContent='Error: '+(e.reason&&e.reason.message||e.reason)});
</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const MOVING_EVERY=10, STOPPED_EVERY=60, MIN_MOVING_KMH=2; // GPS noise below ~2 km/h counts as stopped
let sb=null,CFG_OK=false;
try{
 const u=String(typeof SUPABASE_URL==='undefined'?'':SUPABASE_URL),k=String(typeof SUPABASE_KEY==='undefined'?'':SUPABASE_KEY);
 const okU=/^https:\/\/[a-z0-9]{15,30}\.supabase\.co$/.test(u),okK=k.startsWith('eyJ')&&k.length>100;
 $('dbg').textContent='Build 2 | Server: '+(u||'(empty)')+' '+(okU?'(looks OK)':'(WRONG)')+' | Key: '+(okK?'looks OK':'WRONG');
 if(!okU)$('err').textContent='The Server address in config.js is wrong. It must look like https://abcdefghijklmnopqrst.supabase.co';
 else if(!okK)$('err').textContent='The Key in config.js is wrong. It must be the long anon key starting with eyJ';
 else{sb=supabase.createClient(u,k);CFG_OK=true}
}catch(e){$('err').textContent='Setup error: '+(e.message||e)}
let me,asg,watcher,lastSent=0,queue=JSON.parse(localStorage.q||'[]');
async function signIn(){
 $('err').textContent='Signing in...';
 try{
  if(!CFG_OK)throw new Error('Fix config.js first (see the top line of this screen).');
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)throw error;
  $('err').textContent='';await init();
 }catch(e){$('err').textContent='Error: '+(e.message||e)}
}
async function init(){
 if(!sb)return;
 const {data:{session}}=await sb.auth.getSession();if(!session)return;me=session.user;
 const {data}=await sb.from('assignments').select('vehicle_id,driver_id,vehicles(name),drivers(name)').eq('user_id',me.id).maybeSingle();
 asg=data;$('lg').classList.add('hide');$('app').classList.remove('hide');
 $('who').innerHTML=asg?.vehicles?`${asg.vehicles.name}<br><small>${asg.drivers?.name||'No driver linked'}</small>`:'No vehicle linked. Ask your admin.';
}
async function start(){
 if(!asg?.vehicle_id){$('err').textContent='No vehicle linked to this user.';return}
 try{
 const BG=Capacitor.registerPlugin('BackgroundGeolocation');
 watcher=await BG.addWatcher({backgroundTitle:'Trip in progress',backgroundMessage:'Sending location to fleet dashboard',requestPermissions:true,stale:false,distanceFilter:0},
 async(loc,err)=>{
  if(err){if(err.code==='NOT_AUTHORIZED')$('err').textContent='Allow location "All the time" in app settings.';return}
  const kmh=Math.max(0,(loc.speed||0)*3.6),moving=kmh>=MIN_MOVING_KMH,every=(moving?MOVING_EVERY:STOPPED_EVERY)*1000;
  $('st').textContent=`${Math.round(kmh)} km/h · ${loc.latitude.toFixed(5)}, ${loc.longitude.toFixed(5)}`;
  if(Date.now()-lastSent<every-500)return;lastSent=Date.now();
  queue.push({user_id:me.id,vehicle_id:asg.vehicle_id,driver_id:asg.driver_id,vehicle_name:asg.vehicles?.name,driver_name:asg.drivers?.name,lat:loc.latitude,lng:loc.longitude,speed:moving?kmh:0,recorded_at:new Date(loc.time||Date.now()).toISOString()});
  flush()});
 $('go').classList.add('hide');$('stp').classList.remove('hide');
 }catch(e){$('err').textContent='Error: '+(e.message||e)}
}
async function flush(){localStorage.q=JSON.stringify(queue);if(!queue.length)return;const batch=queue.slice(0,50);const {error}=await sb.from('positions').insert(batch);if(error){$('err').textContent='Upload error: '+error.message;return}queue=queue.slice(batch.length);localStorage.q=JSON.stringify(queue)}
async function stop(){await Capacitor.registerPlugin('BackgroundGeolocation').removeWatcher({id:watcher});$('go').classList.remove('hide');$('stp').classList.add('hide');$('st').textContent='Stopped'}
init();
</script></body></html>
